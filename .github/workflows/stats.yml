name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 = 北京 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-host github-readme-stats and generate SVGs
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clone github-readme-stats (Vercel serverless; its public instance is unavailable)
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs
          cd /tmp/grs
          # husky postinstall fails outside a git repo; skip all scripts
          npm install --omit=dev --ignore-scripts --no-audit --no-fund > /dev/null 2>&1 || npm install --omit=dev --ignore-scripts --no-audit --no-fund
          cp "$GITHUB_WORKSPACE/.github/stats-server.mjs" server.mjs
          cp "$GITHUB_WORKSPACE/.github/custom-stats.mjs" custom-stats.mjs
          node server.mjs &
          # wait for server to come up
          for i in $(seq 1 15); do
            if curl -sf -o /dev/null "http://127.0.0.1:3999/api?username=catwenlabs"; then break; fi
            sleep 2
          done
          mkdir -p "$GITHUB_WORKSPACE/stats"
          curl -sf --retry 3 "http://127.0.0.1:3999/api?username=catwenlabs&show_icons=true&hide_title=true&count_private=true&theme=transparent" \
            -o "$GITHUB_WORKSPACE/stats/stats.svg"
          curl -sf --retry 3 "http://127.0.0.1:3999/api/top-langs/?username=catwenlabs&layout=compact&theme=transparent&hide=css,html" \
            -o "$GITHUB_WORKSPACE/stats/top-langs.svg"
          ls -la "$GITHUB_WORKSPACE/stats"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update GitHub stats SVGs"
          git push
