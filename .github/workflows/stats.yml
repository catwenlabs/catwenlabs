name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 = 北京 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        run: |
          mkdir -p stats
          curl -sL --retry 3 \
            "https://stats.justsong.cn/api/github?username=catwenlabs&theme=transparent" \
            -o stats/stats.svg
          curl -sL --retry 3 \
            "https://stats.justsong.cn/api/github?username=catwenlabs&type=top-langs&theme=transparent" \
            -o stats/top-langs.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update GitHub stats SVGs"
          git push
